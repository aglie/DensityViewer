name: CMake

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Static Qt5
      uses: orestonce/install-qt-static@v0.4.3
      with:
        version: Qt5.15.7-Windows-x86_64-MinGW8.1.0-staticFull-20221104

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DBUILD_STATIC=ON `
          -DCMAKE_PREFIX_PATH="C:/QtStatic"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        path: build/PDFViewer.exe
        name: PDFViewer-Windows-Static

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DBUILD_STATIC=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Bundle with macdeployqt
      run: |
        macdeployqt build/PDFViewer.app -dmg
        mv build/PDFViewer.dmg build/PDFViewer-macOS.dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        path: build/PDFViewer-macOS.dmg
        name: PDFViewer-macOS-DMG

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: PDFViewer-Windows-Static
        path: release-artifacts/windows

    - name: Download MacOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: PDFViewer-macOS-DMG
        path: release-artifacts/macos

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release-artifacts/windows/PDFViewer.exe
          release-artifacts/macos/PDFViewer-macOS.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
